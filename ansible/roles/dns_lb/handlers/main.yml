---
- name: Apply sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-nonlocal-bind.conf
  changed_when: true

- name: Reload haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: reloaded

- name: Restart dnsdist
  ansible.builtin.systemd_service:
    name: dnsdist
    state: restarted

- name: Restart nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted

- name: Restart keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted
