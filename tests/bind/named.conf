// Lab only: stands in for the post's resolvers (recursion yes) and
// authoritative servers (recursion no). lab.sh sets RECURSION and SERVERNAME.
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion RECURSION;
    allow-query { any; };
    allow-recursion { any; };
    allow-transfer { any; };
    dnssec-validation no;
};
zone "lab.test" { type primary; file "/etc/bind/lab.zone"; };
